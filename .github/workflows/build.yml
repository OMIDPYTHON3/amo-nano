name: Build amo-nano

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.4

jobs:
  arm64:
    name: arm64 (Linux aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Download linux-arm64 Node.js runtime
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/node-arm64"
          FILE="node-${NODE_VERSION}-linux-arm64"
          OUT="$RUNNER_TEMP/${FILE}.archive"
          for url in \
            "https://nodejs.org/dist/${NODE_VERSION}/${FILE}.tar.xz" \
            "https://nodejs.org/download/release/${NODE_VERSION}/${FILE}.tar.xz" \
            "https://nodejs.org/dist/${NODE_VERSION}/${FILE}.tar.gz" \
            "https://nodejs.org/download/release/${NODE_VERSION}/${FILE}.tar.gz"; do
            echo "Trying $url"
            if curl -fsSL --retry 2 --retry-all-errors "$url" -o "$OUT"; then
              echo "Downloaded from $url"
              break
            fi
          done
          test -s "$OUT"
          tar -xf "$OUT" -C "$RUNNER_TEMP/node-arm64" --strip-components=1
          "$RUNNER_TEMP/node-arm64/bin/node" --version || true
      - name: Build (esbuild + Node SEA + postject)
        env:
          AMO_NODE_BASE: ${{ runner.temp }}/node-arm64/bin/node
          AMO_TARGET_ARCH: arm64
        run: npm run build
      - name: Verify binary architecture
        run: |
          file amo
          file amo | grep -q 'ARM aarch64'
      - name: Prepare artifact
        run: cp amo amo-nano-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: amo-nano-linux-arm64
          path: amo-nano-linux-arm64
          if-no-files-found: error

  amd64:
    name: amd64 (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          cache: npm
      - run: npm ci
      - name: Build (esbuild + Node SEA + postject)
        env:
          AMO_TARGET_ARCH: amd64
        run: npm run build
      - name: Verify binary architecture
        run: |
          file amo
          file amo | grep -q 'x86-64'
      - name: Prepare artifact
        run: cp amo amo-nano-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: amo-nano-linux-amd64
          path: amo-nano-linux-amd64
          if-no-files-found: error

  release:
    name: Release
    needs: [arm64, amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify both binaries are present
        run: |
          set -e
          ls -lh artifacts
          test -s artifacts/amo-nano-linux-arm64
          test -s artifacts/amo-nano-linux-amd64
      - name: Create GitHub Release and attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          set -e
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "amo-nano ${TAG}" \
            --generate-notes \
            artifacts/amo-nano-linux-arm64 \
            artifacts/amo-nano-linux-amd64
